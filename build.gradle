plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'application'
}

group = 'org.marsrover'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

kotlin {
    jvmToolchain(25)
}

application {
    mainClass = 'org.marsrover.MainKt'
}

test {
    useJUnitPlatform()
}
